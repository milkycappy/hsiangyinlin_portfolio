<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Likeness character study by Hsiang-Yin Lin.">
  <title>Likeness Study | Hsiang-Yin Lin</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header site-shell">
    <a class="brand" href="index.html"><img class="brand-image" src="assets/icon_name.png" alt="Hsiang-Yin Lin | 3D Artist"></a>
    <nav class="header-links" aria-label="Contact links">
      <a class="icon-link" href="https://www.linkedin.com/" aria-label="LinkedIn"><img src="assets/linkedin.svg" alt=""></a>
      <a class="icon-link" href="mailto:4hsiangyinlin@gmail.com" aria-label="Email"><img src="assets/email.svg" alt=""></a>
    </nav>
  </header>
  <main class="detail-page site-shell">
    <header class="detail-intro">
      <h1>Kristen Stewart Likeness</h1>
      <p>This is my personal project. Achieving a convincing likeness has always been a challenge for me. Through this project, I found that elements such as makeup, dyed hair, and subtle facial expressions can really bring out the character's nuances.</p>
    </header>
    <section class="likeness-grid" aria-label="Kristen Stewart likeness renders">
      <img src="assets/likeness01.png" alt="Front view of Kristen Stewart likeness portrait">
      <img src="assets/likeness02.png" alt="Three-quarter view of Kristen Stewart likeness portrait">
      <img src="assets/likeness03.png" alt="Third view of Kristen Stewart likeness portrait">
      <img src="assets/likeness04.png" alt="Forth view of Kristen Stewart likeness portrait">
      <img src="assets/likeness05.png" alt="Last view of Kristen Stewart likeness portrait">
    </section>
    <dialog class="image-lightbox" aria-label="Larger image view">
      <button class="lightbox-close" type="button" aria-label="Close image">×</button>
      <img src="" alt="">
    </dialog>
  </main>
  <script>
  const lightbox = document.querySelector('.image-lightbox');
  const largeImage = lightbox.querySelector('img');
  const closeButton = lightbox.querySelector('.lightbox-close');
  let lastFocusedImage;

  document.querySelectorAll('.likeness-grid img').forEach((image) => {
    image.tabIndex = 0;
    image.setAttribute('role', 'button');
    image.setAttribute('aria-label', `View larger image: ${image.alt}`);

    function openImage() {
      lastFocusedImage = image;
      largeImage.src = image.src;
      largeImage.alt = image.alt;
      lightbox.showModal();
    }

    image.addEventListener('click', openImage);
    image.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openImage();
      }
    });
  });

  closeButton.addEventListener('click', () => lightbox.close());

  lightbox.addEventListener('click', (event) => {
    if (event.target === lightbox) lightbox.close();
  });

  lightbox.addEventListener('close', () => {
    largeImage.removeAttribute('src');
    lastFocusedImage?.focus();
  });
</script>
</body>
</html>
